# Prefix: Ctrl-a (easier reach than Ctrl-b)
unbind C-b
set -g prefix C-a
bind C-a send-prefix

# Reload config
bind r source-file ~/.tmux.conf \; display "Config reloaded"

# Split with | and - (intuitive), open in current path
bind | split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"
unbind '"'
unbind %

# New window in current path
bind c new-window -c "#{pane_current_path}"

# Vim-style pane navigation — hands off to smart-splits.nvim
bind -n C-h if -F "#{@pane-is-vim}" "send-keys C-h" "select-pane -L"
bind -n C-j if -F "#{@pane-is-vim}" "send-keys C-j" "select-pane -D"
bind -n C-k if -F "#{@pane-is-vim}" "send-keys C-k" "select-pane -U"
bind -n C-l if -F "#{@pane-is-vim}" "send-keys C-l" "select-pane -R"

# Resize panes with prefix + HJKL
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Mouse: click to focus, drag to resize
set -g mouse on

# Don't rename windows automatically once you've named them
set -g allow-rename off

# Start window/pane numbers at 1 (easier keyboard reach)
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set -g renumber-windows on

# Bigger scrollback
set -g history-limit 10000

# Faster key response (reduces ESC delay in nvim)
set -sg escape-time 0
set -g focus-events on

# True colour
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB,xterm-ghostty:RGB"

# Status bar
set -g status-position bottom
set -g status-style "bg=#1f2335,fg=#c0caf5"
set -g status-left "#[bold,fg=#7aa2f7] #S #[nobold,fg=#3b4261] | "
set -g status-left-length 30
set -g status-right "#[fg=#3b4261]%H:%M  %d %b"
set -g status-right-length 30

# Window tabs
set -g window-status-format " #I:#W "
set -g window-status-current-format "#[bold,fg=#7aa2f7,bg=#292e42] #I:#W "

# Pane borders
set -g pane-border-style "fg=#292e42"
set -g pane-active-border-style "fg=#7aa2f7"

# Vi mode for copy
set -g mode-keys vi
bind -T copy-mode-vi v send-keys -X begin-selection
bind -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "pbcopy"

# Quick layout: editor left (wide), two stacked panes right
# Run with: prefix + W
bind W \
  split-window -h -p 35 -c "#{pane_current_path}" \;\
  split-window -v -p 30 -c "#{pane_current_path}" \;\
  select-pane -L
